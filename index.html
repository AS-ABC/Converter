<!-- language: html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Encodage des caractères -->
  <meta charset="UTF-8">

  <!-- Affichage responsive pour tous les types d'appareils -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Titre de l'onglet -->
  <title>Convertisseur AS-ABC</title>

  <!-- Favicon (icône de l'onglet) -->
  <link rel="icon" type="image/jpeg" href="ressources/icon.jpg">

  <!-- Importation d'une police Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400&display=swap" rel="stylesheet">

  <!-- Début des styles du fichier CSS intégré au code html-->
  <style>
    /* Définition des variables CSS */
    :root {
      --primary-color: #E7AF2F;         /* Couleur principale (jaune/or) */
      --secondary-color: #5d6d7e;       /* Couleur secondaire (gris/bleu) */
      --bg-opacity: 0.3;                /* Opacité du fond (effet verre) */
      --blur-amount: 3px;               /* Flou pour l'effet "verre" */
      --border-radius: 10px;            /* Arrondi des éléments */
      --button-radius: 30px;            /* Arrondi des boutons */
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);  /* Ombre portée */
      --transition: all 0.2s ease-in-out;      /* Transition fluide */
    }

    * { box-sizing: border-box; }

    body {
      background: url('ressources/Renault-5-E-Tech-electric.jpg') center 40% / cover no-repeat;
      margin: 10px;
      font-family: sans-serif;
      line-height: 1.6;
    }

    .container { max-width: none; margin: 0; }

    .glass-effect {
      background-color: rgba(255, 255, 255, var(--bg-opacity));
      border: none;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(var(--blur-amount));
    }

    .scrolling-container {
      background-color: rgba(255, 255, 255, 0.1);
      min-height: 60px;
      height: auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      backdrop-filter: blur(4px);
      padding: 15px 10px;
      width: 100%;
    }

    .scrolling-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: clamp(1.1rem, 3.5vw, 2.8rem);
      font-weight: 300;
      font-stretch: condensed;
      letter-spacing: -0.08em;
      color: white;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      display: block;
      text-align: center;
      max-width: 100%;
      hyphens: auto;
      transform: scaleY(1.35);
      transform-origin: center;
      line-height: calc(1.2 / 1.25);
    }

    .char-random { color: var(--primary-color); }

    h1 { color: black; margin: 20px 0 15px 0; }

    .button-group { margin-bottom: 10px; }

    .icon-button {
      display: inline-flex;
      align-items: stretch;
      border-radius: var(--button-radius);
      margin-bottom: 10px;
      margin-right: 10px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 16px;
      height: 40px;
      border: 2px solid black;
      background: none;
      transition: var(--transition);
      padding: 0;
      position: relative;
    }

    .icon-button:hover { transform: scale(1.05); }
    .icon-button:focus { outline: 2px solid var(--primary-color); outline-offset: 2px; }

    .icon-part {
      background-color: var(--secondary-color);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top-left-radius: var(--button-radius);
      border-bottom-left-radius: var(--button-radius);
      position: relative;
      z-index: 2;
    }

    .icon-part img { width: 38px; height: 38px; }

    .icon-part::after {
      content: '';
      position: absolute;
      top: 0;
      right: -15px;
      width: 30px;
      height: 36px;
      background-color: var(--primary-color);
      border-radius: var(--button-radius) 0 0 var(--button-radius);
      z-index: 3;
      pointer-events: none;
    }

    .text-part {
      background-color: var(--primary-color);
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-top-right-radius: var(--button-radius);
      border-bottom-right-radius: var(--button-radius);
      position: relative;
      z-index: 1;
    }

    textarea {
      width: calc(100% - 12px);
      min-height: 70px;
      margin-bottom: 10px;
      padding: 10px;
      color: black;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      transition: var(--transition);
    }

    textarea:focus { outline: 2px solid var(--primary-color); }
    textarea[readonly] { cursor: default; background-color: rgba(255, 255, 255, 0.2); }

    .success-message,
    .error-message,
    .info-message {
      color: white;
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .success-message { background-color: rgba(76, 175, 80, 0.8); }
    .error-message   { background-color: rgba(244, 67, 54, 0.8); }
    .info-message    { background-color: rgba(33, 150, 243, 0.8); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 1200px) {
      .scrolling-container { min-height: 70px; padding: 20px 15px; }
      .scrolling-text { font-size: clamp(2rem, 3.5vw, 3.2rem); }
    }

    @media (max-width: 1024px) {
      .scrolling-container { min-height: 60px; padding: 15px 10px; }
      .scrolling-text { font-size: clamp(1.6rem, 3.2vw, 2.5rem); }
    }

    @media (max-width: 768px) {
      body { margin: 5px; }
      .scrolling-container { min-height: 50px; padding: 10px 8px; }
      .scrolling-text { font-size: clamp(1.3rem, 3vw, 2rem); }
      .icon-button { font-size: 14px; height: 36px; }
      .text-part { padding: 0 12px; }
    }

    @media (max-width: 480px) {
      .scrolling-container { min-height: 45px; padding: 8px 5px; }
      .scrolling-text { font-size: clamp(1.1rem, 2.8vw, 1.6rem); }
      .button-group { flex-direction: column; }
      .icon-button { width: 100%; justify-content: flex-start; }
    }

    @media (max-width: 320px) {
      .scrolling-container { min-height: 40px; padding: 5px; }
      .scrolling-text { font-size: clamp(1rem, 2.2vw, 1.4rem); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scrolling-container glass-effect">
      <div class="scrolling-text" id="animatedText" role="banner" aria-live="polite"></div>
    </div>

    <main>
      <!-- Section d'entrée utilisateur -->
      <section>
        <!-- Bouton "Rafraîchir" au-dessus de "Liste à convertir" -->
        <div class="button-group">
          <button class="icon-button" onclick="rafraichirPage()" aria-label="Rafraîchir la page">
            <div class="icon-part"><img src="ressources/project.svg" alt=""></div>
            <div class="text-part">Rafraîchir</div>
          </button>
        </div>

        <h1>Liste à convertir</h1>

        <textarea 
          id="referencesInput" 
          class="glass-effect"
          placeholder="Merci d'entrer votre liste ici (En colonne SVP)"
          aria-label="Liste des références à convertir"
        ></textarea>
      </section>

      <!-- Section de sortie (résultat) -->
      <section>
        <!-- Boutons de format au-dessus de "Liste Convertie" -->
        <div class="button-group">
          <button class="icon-button" onclick="choisirFormat('simplicite')" aria-label="Convertir au format AS-ABC Simplicité">
            <div class="icon-part"><img src="ressources/project.svg" alt=""></div>
            <div class="text-part">AS-ABC Simplicité</div>
          </button>

          <button class="icon-button" onclick="choisirFormat('spotfire')" aria-label="Convertir au format Spotfire">
            <div class="icon-part"><img src="ressources/project.svg" alt=""></div>
            <div class="text-part">Spotfire</div>
          </button>
        </div>

        <h1>Liste Convertie</h1>

        <!-- Bouton "Copier le résultat" juste sous "Liste Convertie" -->
        <div class="button-group">
          <button class="icon-button" onclick="copierResultat()" aria-label="Copier le résultat dans le presse-papiers">
            <div class="icon-part"><img src="ressources/project.svg" alt=""></div>
            <div class="text-part">Copier le résultat</div>
          </button>
        </div>

        <!-- Messages -->
        <div id="infoMessage" class="info-message">ℹ Liste convertie avec succès !</div>
        <div id="successMessage" class="success-message">✓ Résultat copié avec succès !</div>
        <div id="errorMessage" class="error-message">✗ Aucun résultat. Veuillez d'abord entrer une liste à convertir.</div>

        <!-- Zone de sortie -->
        <textarea 
          id="convertedReferences" 
          class="glass-effect"
          readonly 
          aria-label="Résultat de la conversion"
        ></textarea>

        <!-- Deuxième bouton "Copier le résultat" placé sous le champ de résultat -->
        <div class="button-group">
          <button class="icon-button" onclick="copierResultat()" aria-label="Copier le résultat dans le presse-papiers">
            <div class="icon-part"><img src="ressources/project.svg" alt=""></div>
            <div class="text-part">Copier le résultat</div>
          </button>
        </div>
      </section>
    </main>
  </div>

<script>
  const CONFIG = {
    chars: "!()*+[#]{_}|<->/?",
    revealDelay: 30,
    pauseBetweenPhrases: 1500,
    phrases: [
      "Bienvenue sur notre convertisseur multi-formats",
      "Convertissez au format AS-ABC en toute Simplicité !",
      "Consultez en masse des réfs, Triplets ID etc..."
    ]
  };

  let currentPhraseIndex = 0;
  const $ = id => document.getElementById(id);
  const randomChar = () => CONFIG.chars[Math.floor(Math.random() * CONFIG.chars.length)];

  function choisirFormat(format) {
    const input = $('referencesInput').value.trim();
    if (!input) {
      showErrorMessage();
      return;
    }

    const refs = input.split('\n').map(ref => ref.trim()).filter(ref => ref.length > 0);
    if (refs.length === 0) {
      alert('Aucune référence valide trouvée.');
      return;
    }

    const formatters = {
      simplicite: refs => `in (${refs.map(ref => `'${ref}'`).join(', ')})`,
      spotfire: refs => refs.join(' or '),
      dbeaver: refs => `in (${refs.map(ref => `'${ref}'`).join(',\n')})`
    };

    const finalText = formatters[format]?.(refs) || '';
    const output = $('convertedReferences');
    output.value = finalText;
    output.style.height = 'auto';
    output.style.height = (output.scrollHeight) + 'px';

    showInfoMessage();
  }

  function copierResultat() {
    const output = $('convertedReferences');
    if (!output.value.trim()) {
      showErrorMessage();
      return;
    }

    if (navigator.clipboard) {
      navigator.clipboard.writeText(output.value).then(() => {
        showSuccessMessage();
      }).catch(() => {
        fallbackCopy(output);
      });
    } else {
      fallbackCopy(output);
    }
  }

  function fallbackCopy(output) {
    output.select();
    const success = document.execCommand("copy");
    if (success) {
      showSuccessMessage();
    }
  }

  function showSuccessMessage() {
    const message = $('successMessage');
    message.style.display = 'block';
    setTimeout(() => { message.style.display = 'none'; }, 3000);
  }

  function showErrorMessage() {
    const message = $('errorMessage');
    message.style.display = 'block';
    setTimeout(() => { message.style.display = 'none'; }, 3000);
  }

  function showInfoMessage() {
    const message = $('infoMessage');
    message.style.display = 'block';
    setTimeout(() => { message.style.display = 'none'; }, 3000);
  }

  function rafraichirPage() {
    location.reload();
  }

  function decryptEffect(text, callback) {
    const container = $("animatedText");
    const revealed = new Array(text.length).fill(false);
    const letterIndexes = [...Array(text.length).keys()].filter(i => text[i] !== ' ');
    const shuffled = [...letterIndexes].sort(() => Math.random() - 0.5);
    const threshold = Math.floor(letterIndexes.length * 0.6);

    shuffled.slice(threshold).forEach(i => revealed[i] = true);
    const toReveal = shuffled.slice(0, threshold);
    let revealedCount = 0;

    function animate() {
      let display = "";
      for (let i = 0; i < text.length; i++) {
        if (text[i] === ' ') {
          display += ' ';
        } else if (revealed[i]) {
          display += `<span>${text[i]}</span>`;
        } else {
          display += `<span class="char-random">${randomChar()}</span>`;
        }
      }

      container.innerHTML = display;

      if (revealedCount < toReveal.length) {
        const randomIndex = toReveal[Math.floor(Math.random() * toReveal.length)];
        if (!revealed[randomIndex]) {
          revealed[randomIndex] = true;
          revealedCount++;
        }
        setTimeout(animate, CONFIG.revealDelay);
      } else {
        setTimeout(callback, CONFIG.pauseBetweenPhrases);
      }
    }

    animate();
  }

  function startTextAnimation() {
    decryptEffect(CONFIG.phrases[currentPhraseIndex], () => {
      currentPhraseIndex = (currentPhraseIndex + 1) % CONFIG.phrases.length;
      startTextAnimation();
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    startTextAnimation();
  });

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      switch(e.key) {
        case 'Enter':
          e.preventDefault();
          choisirFormat('simplicite');
          break;
        case 'c':
          if (e.target !== $('referencesInput')) {
            e.preventDefault();
            copierResultat();
          }
          break;
      }
    }
  });
</script>

</body>
</html>
